<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Zero build, Node 22, GSAP 3.12.5, Lenis 1.1.13, opt-in measurements">
  <defs>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .pill{fill:#0b0806;fill-opacity:.92;stroke:#f0a032;stroke-opacity:.28}
      .dot{animation:pulse 3.4s ease-in-out infinite}
      .d2{animation-delay:-.55s}.d3{animation-delay:-1.1s}.d4{animation-delay:-1.65s}.d5{animation-delay:-2.2s}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <g class="mono" font-size="9.5" letter-spacing="1.7">
    <g>
      <rect class="pill" x="118" y="4" width="170" height="36" rx="18"/>
      <circle class="dot" cx="138" cy="22" r="2.6" fill="#f0a032"/>
      <text x="152" y="26" fill="#c9b8a5">ZERO BUILD</text>
    </g>
    <g>
      <rect class="pill" x="304" y="4" width="162" height="36" rx="18"/>
      <circle class="dot d2" cx="324" cy="22" r="2.6" fill="#f0a032"/>
      <text x="338" y="26" fill="#c9b8a5">NODE 22+</text>
    </g>
    <g>
      <rect class="pill" x="482" y="4" width="192" height="36" rx="18"/>
      <circle class="dot d3" cx="502" cy="22" r="2.6" fill="#f0a032"/>
      <text x="516" y="26" fill="#c9b8a5">GSAP 3.12.5</text>
    </g>
    <g>
      <rect class="pill" x="690" y="4" width="186" height="36" rx="18"/>
      <circle class="dot d4" cx="710" cy="22" r="2.6" fill="#f0a032"/>
      <text x="724" y="26" fill="#c9b8a5">LENIS 1.1.13</text>
    </g>
    <g>
      <rect class="pill" x="892" y="4" width="190" height="36" rx="18"/>
      <circle class="dot d5" cx="912" cy="22" r="2.6" fill="#f0a032"/>
      <text x="926" y="26" fill="#c9b8a5">OPT-IN METRICS</text>
    </g>
  </g>
</svg>
