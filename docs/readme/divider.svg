<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="An ornament of a steaming handi between two lines">
  <defs>
    <style>
      .steam{fill:none;stroke:#f0a032;stroke-width:1.1;stroke-linecap:round;stroke-dasharray:5 10;animation:rise 5.2s linear infinite;opacity:.5}
      .s2{animation-delay:-1.7s}.s3{animation-delay:-3.4s}
      @keyframes rise{0%{stroke-dashoffset:18;opacity:0}25%{opacity:.7}100%{stroke-dashoffset:-26;opacity:0}}
      .line{animation:breathe 6s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.28}50%{opacity:.7}}
      .spark{animation:twinkle 4.5s ease-in-out infinite}
      .t2{animation-delay:-1.5s}.t3{animation-delay:-3s}
      @keyframes twinkle{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:.8;transform:scale(1)}}
      .spark{transform-box:fill-box;transform-origin:center}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
    <linearGradient id="fadeL" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="540" y2="0">
      <stop offset="0" stop-color="#f0a032" stop-opacity="0"/>
      <stop offset=".65" stop-color="#f0a032" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f0a032" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="fadeR" gradientUnits="userSpaceOnUse" x1="660" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#f0a032" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#f0a032" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f0a032" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path class="line" d="M40 42 H540" stroke="url(#fadeL)"/>
  <path class="line" d="M660 42 H1160" stroke="url(#fadeR)"/>
  <g fill="#f0a032" class="spark">
    <path transform="translate(556 42) scale(.55)" d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z"/>
  </g>
  <g fill="#f0a032" class="spark t2">
    <circle cx="644" cy="42" r="1.8"/>
  </g>
  <g fill="#f4e9d8" class="spark t3">
    <circle cx="600" cy="17" r="1.2"/>
  </g>
  <circle cx="600" cy="42" r="26" fill="#0b0806" stroke="#f0a032" stroke-opacity=".3"/>
  <g transform="translate(600 43)" fill="none" stroke="#f0a032" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-13 0 H13 C13 10 9 15 0 15 C-9 15 -13 10 -13 0 Z"/>
    <path d="M-17 0 H17"/>
    <path d="M-9 -4 C-6 -9 6 -9 9 -4"/>
    <path d="M-13 5 H-17 V10 H-11 M13 5 H17 V10 H11"/>
    <g>
      <path class="steam" d="M-5 -10 C-8 -14 -3 -16 -5 -21"/>
      <path class="steam s2" d="M0 -10 C-3 -14 2 -16 0 -22"/>
      <path class="steam s3" d="M5 -10 C2 -14 7 -16 5 -21"/>
    </g>
  </g>
</svg>
